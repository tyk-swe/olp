[advisories]
ignore = []
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
# These incompatible transitive lines are the current, reviewed duplicate set.
# Removing an entry is required when its dependency graph converges.
skip = [
    { name = "block-buffer", version = "0.12.1" },
    { name = "cpufeatures", version = "0.3.0" },
    { name = "crypto-common", version = "0.2.2" },
    { name = "digest", version = "0.11.3" },
    { name = "getrandom", version = "0.2.17" },
    { name = "getrandom", version = "0.3.4" },
    { name = "hashbrown", version = "0.17.1" },
    { name = "http", version = "0.2.12" },
    { name = "http-body", version = "0.4.6" },
    { name = "r-efi", version = "5.3.0" },
    { name = "rand", version = "0.10.2" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rand_core", version = "0.10.1" },
    { name = "sha2", version = "0.11.0" },
    { name = "syn", version = "3.0.3" },
    # reqwest 0.13 still builds on tower-http 0.6 while apps/olp is on 0.7;
    # drop this once reqwest releases against 0.7.
    { name = "tower-http", version = "0.6.11" },
    { name = "untrusted", version = "0.7.1" },
    { name = "windows-sys", version = "0.52.0" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License (permissive, OSI/FSF approved) — not the
    # source-available BUSL-1.1. Reached via redis 1 -> xxhash-rust.
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
