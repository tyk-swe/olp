name: Live providers
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to validate using the live-providers environment
        type: choice
        required: true
        default: openai
        options: [openai, anthropic, gemini, azure_openai, vertex, bedrock]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-providers
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - env:
          OLP_LIVE_PROVIDER: ${{ inputs.provider }}
          OLP_LIVE_OPENAI_API_KEY: ${{ secrets.OLP_LIVE_OPENAI_API_KEY }}
          OLP_LIVE_ANTHROPIC_API_KEY: ${{ secrets.OLP_LIVE_ANTHROPIC_API_KEY }}
          OLP_LIVE_GEMINI_API_KEY: ${{ secrets.OLP_LIVE_GEMINI_API_KEY }}
          OLP_AZURE_OPENAI_LIVE_ENDPOINT: ${{ vars.OLP_AZURE_OPENAI_LIVE_ENDPOINT }}
          OLP_AZURE_OPENAI_LIVE_DEPLOYMENT: ${{ vars.OLP_AZURE_OPENAI_LIVE_DEPLOYMENT }}
          OLP_AZURE_OPENAI_LIVE_API_VERSION: ${{ vars.OLP_AZURE_OPENAI_LIVE_API_VERSION }}
          OLP_AZURE_OPENAI_LIVE_API_KEY: ${{ secrets.OLP_AZURE_OPENAI_LIVE_API_KEY }}
          OLP_VERTEX_LIVE_PROJECT: ${{ vars.OLP_VERTEX_LIVE_PROJECT }}
          OLP_VERTEX_LIVE_LOCATION: ${{ vars.OLP_VERTEX_LIVE_LOCATION }}
          OLP_VERTEX_LIVE_MODEL: ${{ vars.OLP_VERTEX_LIVE_MODEL }}
          OLP_GOOGLE_CREDENTIALS_JSON: ${{ secrets.OLP_GOOGLE_CREDENTIALS_JSON }}
          OLP_BEDROCK_LIVE_REGION: ${{ vars.OLP_BEDROCK_LIVE_REGION }}
          OLP_BEDROCK_LIVE_MODEL: ${{ vars.OLP_BEDROCK_LIVE_MODEL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [[ "$OLP_LIVE_PROVIDER" == vertex ]]; then
            umask 077
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/olp-google-credentials.json"
            printf '%s' "$OLP_GOOGLE_CREDENTIALS_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
            trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          fi
          cargo test --locked --all-features --lib "providers::${OLP_LIVE_PROVIDER}::" -- --ignored
