name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v0.*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualification:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
  qualify-code:
    needs: qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install fixture sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor bubblewrap
          if ! bwrap --unshare-net --unshare-pid --ro-bind / / /usr/bin/true; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile olp-qualification-bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' > "$RUNNER_TEMP/olp-qualification-bwrap"
            sudo apparmor_parser -r "$RUNNER_TEMP/olp-qualification-bwrap"
          fi
          bwrap --unshare-net --unshare-pid --ro-bind / / /usr/bin/true
      - name: Install pinned coding clients
        run: |
          scripts/qualification-clients.sh "$RUNNER_TEMP/qualification-clients"
          printf '%s\n' "$RUNNER_TEMP/qualification-clients" >> "$GITHUB_PATH"
      - run: make qualify-code
  qualify-code-live:
    if: vars.OLP_LIVE_QUALIFICATION == 'required'
    needs: qualification
    uses: $/.github/workflows/qualify-code-live.yml
    secrets:
      OLP_LIVE_CODEX_AUTH_JSON: ${{ secrets.OLP_LIVE_CODEX_AUTH_JSON }}
      OLP_LIVE_CODEX_AUTH_JSON_2: ${{ secrets.OLP_LIVE_CODEX_AUTH_JSON_2 }}
      OLP_LIVE_CODEX_MODEL: ${{ secrets.OLP_LIVE_CODEX_MODEL }}
      OLP_LIVE_GLM_GLOBAL_KEY: ${{ secrets.OLP_LIVE_GLM_GLOBAL_KEY }}
      OLP_LIVE_GLM_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_GLM_GLOBAL_MODEL }}
      OLP_LIVE_GLM_CN_KEY: ${{ secrets.OLP_LIVE_GLM_CN_KEY }}
      OLP_LIVE_GLM_CN_MODEL: ${{ secrets.OLP_LIVE_GLM_CN_MODEL }}
      OLP_LIVE_MINIMAX_GLOBAL_KEY: ${{ secrets.OLP_LIVE_MINIMAX_GLOBAL_KEY }}
      OLP_LIVE_MINIMAX_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_MINIMAX_GLOBAL_MODEL }}
      OLP_LIVE_MINIMAX_CN_KEY: ${{ secrets.OLP_LIVE_MINIMAX_CN_KEY }}
      OLP_LIVE_MINIMAX_CN_MODEL: ${{ secrets.OLP_LIVE_MINIMAX_CN_MODEL }}
      OLP_LIVE_KIMI_GLOBAL_KEY: ${{ secrets.OLP_LIVE_KIMI_GLOBAL_KEY }}
      OLP_LIVE_KIMI_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_KIMI_GLOBAL_MODEL }}
      OLP_LIVE_KIMI_CN_KEY: ${{ secrets.OLP_LIVE_KIMI_CN_KEY }}
      OLP_LIVE_KIMI_CN_MODEL: ${{ secrets.OLP_LIVE_KIMI_CN_MODEL }}
      OLP_LIVE_QWEN_GLOBAL_KEY: ${{ secrets.OLP_LIVE_QWEN_GLOBAL_KEY }}
      OLP_LIVE_QWEN_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_QWEN_GLOBAL_MODEL }}
      OLP_LIVE_QWEN_CN_KEY: ${{ secrets.OLP_LIVE_QWEN_CN_KEY }}
      OLP_LIVE_QWEN_CN_MODEL: ${{ secrets.OLP_LIVE_QWEN_CN_MODEL }}
      OLP_LIVE_OPENCODE_GO_KEY: ${{ secrets.OLP_LIVE_OPENCODE_GO_KEY }}
      OLP_LIVE_OPENCODE_GO_MODEL: ${{ secrets.OLP_LIVE_OPENCODE_GO_MODEL }}
    permissions:
      contents: read
  candidate-build:
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-release-version.mjs
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The release key only CI holds signs the documents the binary embeds,
      # and a release build trusts only release keys. Ed25519 signatures are
      # deterministic, so every platform build embeds the same bytes.
      - name: Sign release documents
        env:
          OLP_SIGNING_KEY: ${{ secrets.OLP_SIGNING_KEY }}
          OLP_SIGNING_KEY_ID: ${{ vars.OLP_SIGNING_KEY_ID }}
        run: |
          if [[ -z $OLP_SIGNING_KEY || -z $OLP_SIGNING_KEY_ID ]]; then
            echo "::error::Set the OLP_SIGNING_KEY secret and OLP_SIGNING_KEY_ID variable; see docs/develop/catalog.md#signing-keys" >&2
            exit 1
          fi
          go run ./cmd/olpsign sign -key-id "$OLP_SIGNING_KEY_ID" internal/catalog/catalog.json internal/plugins/pluginindex/index.json
          go run -tags release ./cmd/olpsign verify internal/catalog/catalog.json internal/plugins/pluginindex/index.json
          go test -tags release -run 'TestEmbedded' ./internal/catalog
      - if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-documents
          path: |
            internal/catalog/catalog.json
            internal/catalog/catalog.json.sig
            internal/catalog/schema.json
            internal/plugins/pluginindex/index.json
            internal/plugins/pluginindex/index.json.sig
          if-no-files-found: error
          overwrite: true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            OLP_VERSION=${{ steps.version.outputs.value }}
            OLP_GO_TAGS=release
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          # Release provenance must not bless layers supplied by mutable registry caches.
          no-cache: true
      - name: Export platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/candidate-digests/$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate-digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
  candidate:
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: candidate-digest-*
          path: ${{ runner.temp }}/candidate-digests
          merge-multiple: true
      - name: Assemble candidate index
        id: merge
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            read -r digest < "$RUNNER_TEMP/candidate-digests/$arch"
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/candidate-metadata.json" \
            --tag "$IMAGE:candidate-$GITHUB_SHA" "${sources[@]}"
          digest=$(jq -er '.["containerimage.descriptor"].digest' "$RUNNER_TEMP/candidate-metadata.json")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq -e \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  packaged:
    needs: candidate
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          go-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          OLP_CONSOLE_E2E_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.digest }}
          OLP_IMAGE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/qualify-image.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: packaged-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/olp-candidate-scan/*.json
            ${{ runner.temp }}/olp-candidate-scan/native-inventory
            console/test-results
          if-no-files-found: warn
  promote:
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') && needs.candidate.result == 'success' && needs.packaged.result == 'success' && needs.qualify-code.result == 'success' && (needs.qualify-code-live.result == 'success' || needs.qualify-code-live.result == 'skipped') }}
    needs: [candidate, packaged, qualify-code, qualify-code-live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
          push-to-registry: true
      - env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          version=${RELEASE_TAG#v}
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:${version%.*}" "$IMAGE@$DIGEST"
          published=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          test "$published" = "$DIGEST"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm package deploy/helm --destination /tmp/chart
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/chart/*.tgz
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push /tmp/chart/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: management-contract
          path: /tmp/contracts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-documents
          path: /tmp/signed
      - name: Name the signed release documents
        run: |
          mkdir -p /tmp/catalog
          cp /tmp/signed/catalog/catalog.json /tmp/signed/catalog/catalog.json.sig /tmp/catalog/
          cp /tmp/signed/catalog/schema.json /tmp/catalog/catalog.schema.json
          cp /tmp/signed/plugins/pluginindex/index.json /tmp/catalog/plugin-index.json
          cp /tmp/signed/plugins/pluginindex/index.json.sig /tmp/catalog/plugin-index.json.sig
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Every plugin the reviewed index lists is rebuilt reproducibly from
      # this commit, and the release fails unless each digest is the one the
      # index lists, so the modules published here are the reviewed ones.
      - name: Build the indexed plugins
        run: go run ./cmd/pluginindex check /tmp/catalog
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/catalog/*
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes /tmp/chart/*.tgz /tmp/contracts/management.json /tmp/catalog/*
