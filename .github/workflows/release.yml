name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v0.*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualification:
    uses: ./.github/workflows/ci.yml
  candidate-build:
    needs: qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Check version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-release-version.mjs
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # The release key only CI holds signs the documents the binary embeds,
      # and a release build trusts only release keys. Ed25519 signatures are
      # deterministic, so every platform build embeds the same bytes.
      - name: Sign release documents
        env:
          OLP_SIGNING_KEY: ${{ secrets.OLP_SIGNING_KEY }}
          OLP_SIGNING_KEY_ID: ${{ vars.OLP_SIGNING_KEY_ID }}
        run: |
          if [[ -z $OLP_SIGNING_KEY || -z $OLP_SIGNING_KEY_ID ]]; then
            echo "::error::Set the OLP_SIGNING_KEY secret and OLP_SIGNING_KEY_ID variable; see docs/catalog.md#signing-keys" >&2
            exit 1
          fi
          go run ./internal/signing/cmd/olpsign sign -key-id "$OLP_SIGNING_KEY_ID" internal/catalog/catalog.json internal/pluginindex/index.json
          go run -tags release ./internal/signing/cmd/olpsign verify internal/catalog/catalog.json internal/pluginindex/index.json
          go test -tags release -run 'TestEmbedded' ./internal/catalog ./internal/pluginindex
      - if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-documents
          path: |
            internal/catalog/catalog.json
            internal/catalog/catalog.json.sig
            internal/catalog/schema.json
            internal/pluginindex/index.json
            internal/pluginindex/index.json.sig
          if-no-files-found: error
          overwrite: true
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            OLP_VERSION=${{ steps.version.outputs.value }}
            OLP_GO_TAGS=release
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }},mode=max
      - name: Export platform digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/candidate-digests/$ARCH"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate-digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
  candidate:
    needs: candidate-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: candidate-digest-*
          path: ${{ runner.temp }}/candidate-digests
          merge-multiple: true
      - name: Assemble candidate index
        id: merge
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            read -r digest < "$RUNNER_TEMP/candidate-digests/$arch"
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/candidate-metadata.json" \
            --tag "$IMAGE:candidate-$GITHUB_SHA" "${sources[@]}"
          digest=$(jq -er '.["containerimage.descriptor"].digest' "$RUNNER_TEMP/candidate-metadata.json")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --raw | jq -e \
            '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  packaged:
    needs: candidate
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          OLP_CONSOLE_E2E_IMAGE: ghcr.io/${{ github.repository }}@${{ needs.candidate.outputs.digest }}
          OLP_IMAGE_PLATFORM: ${{ matrix.platform }}
        run: ./scripts/qualify-image.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: packaged-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/olp-candidate-scan/*.json
            ${{ runner.temp }}/olp-candidate-scan/native-inventory
            console/test-results
          if-no-files-found: warn
  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')
    needs: [candidate, packaged]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.candidate.outputs.digest }}
          push-to-registry: true
      - env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          version=${RELEASE_TAG#v}
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:${version%.*}" "$IMAGE@$DIGEST"
          published=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          test "$published" = "$DIGEST"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm package deploy/helm --destination /tmp/chart
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: /tmp/chart/*.tgz
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push /tmp/chart/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: management-contract
          path: /tmp/contracts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-documents
          path: /tmp/signed
      - name: Name the signed release documents
        run: |
          mkdir -p /tmp/catalog
          cp /tmp/signed/catalog/catalog.json /tmp/signed/catalog/catalog.json.sig /tmp/catalog/
          cp /tmp/signed/catalog/schema.json /tmp/catalog/catalog.schema.json
          cp /tmp/signed/pluginindex/index.json /tmp/catalog/plugin-index.json
          cp /tmp/signed/pluginindex/index.json.sig /tmp/catalog/plugin-index.json.sig
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # Every plugin the reviewed index lists is rebuilt reproducibly from
      # this commit, and the release fails unless each digest is the one the
      # index lists, so the modules published here are the reviewed ones.
      - name: Build the indexed plugins
        run: go run ./internal/pluginindex/cmd/pluginindex check /tmp/catalog
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: /tmp/catalog/*
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes /tmp/chart/*.tgz /tmp/contracts/management.json /tmp/catalog/*
