name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts without publishing them
        required: true
        default: true
        type: boolean
      promote_tag:
        description: Existing release tag to promote after a partial release (leave empty normally)
        required: false
        default: ""
        type: string
      promote_image_digest:
        description: Signed image index digest to promote with promote_tag
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  RELEASE_IMAGE: ghcr.io/tyk-swe/olp
  RELEASE_CHART_REGISTRY: oci://ghcr.io/tyk-swe/charts

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    name: Verify release metadata
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.promote_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Verify version pins
        run: make release-version
      - name: Verify release tag
        run: make release-verify

  promotion-recovery:
    name: Promote an existing signed release
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.promote_tag != ''
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DRY_RUN: "false"
      RELEASE_TAG: ${{ inputs.promote_tag }}
      IMAGE_DIGEST: ${{ inputs.promote_image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the tag-bound image signature
        env:
          RELEASE_MANIFEST_STEP: verify
        run: make release-manifest
      - name: Promote the verified release image
        env:
          RELEASE_MANIFEST_STEP: promote
        run: make release-manifest

  image:
    name: Image / ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            cache_scope: image-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: image-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Log in to GHCR
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.DRY_RUN != 'true' }}
          load: ${{ env.DRY_RUN == 'true' }}
          provenance: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ env.DRY_RUN == 'true' && format('openllmproxy:release-{0}', matrix.arch) || '' }}
          outputs: ${{ env.DRY_RUN != 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.RELEASE_IMAGE) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      - name: Record architecture digest
        id: image
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          RELEASE_IMAGE_STEP: record
          RELEASE_IMAGE: ${{ env.RELEASE_IMAGE }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_IMAGE_PLATFORM: ${{ matrix.platform }}
          RELEASE_DIGEST_DIR: ${{ runner.temp }}/release-digests
        run: make release-image
      - name: Smoke dry-run image
        if: ${{ env.DRY_RUN == 'true' }}
        env:
          RELEASE_IMAGE_STEP: smoke
          IMAGE: openllmproxy:release-${{ matrix.arch }}
          OLP_IMAGE_PLATFORM: ${{ matrix.platform }}
        run: make release-image
      - name: Generate architecture SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.DRY_RUN == 'true' && format('openllmproxy:release-{0}', matrix.arch) || format('{0}@{1}', env.RELEASE_IMAGE, steps.image.outputs.digest) }}
          syft-version: v1.46.0
          format: spdx-json
          output-file: openllmproxy-${{ matrix.arch }}.spdx.json
          upload-artifact: false
      - name: Install cosign
        if: ${{ env.DRY_RUN != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Attest architecture SBOM
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          RELEASE_IMAGE_STEP: attest
          IMAGE: ${{ env.RELEASE_IMAGE }}@${{ steps.image.outputs.digest }}
          RELEASE_SBOM: openllmproxy-${{ matrix.arch }}.spdx.json
        run: make release-image
      - name: Upload architecture SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.arch }}
          path: openllmproxy-${{ matrix.arch }}.spdx.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload architecture digest
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-digests/${{ matrix.arch }}.digest
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  manifest:
    name: Multi-architecture image index
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.create.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download architecture digests
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: ${{ env.DRY_RUN != 'true' }}
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Log in to GHCR
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release image index
        id: create
        env:
          RELEASE_MANIFEST_STEP: create
          RELEASE_DIGEST_DIR: ${{ runner.temp }}/release-digests
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-manifest
        run: make release-manifest
      - name: Scan amd64 image for HIGH and CRITICAL vulnerabilities
        if: ${{ env.DRY_RUN != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}@${{ steps.create.outputs.digest }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan arm64 image for HIGH and CRITICAL vulnerabilities
        if: ${{ env.DRY_RUN != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.RELEASE_IMAGE }}@${{ steps.create.outputs.digest }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Install cosign
        if: ${{ env.DRY_RUN != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release image index
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          RELEASE_MANIFEST_STEP: sign
          IMAGE_DIGEST: ${{ steps.create.outputs.digest }}
        run: make release-manifest
      - name: Upload image index metadata
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest-metadata
          path: ${{ runner.temp }}/release-manifest/image-index-digest.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke:
    name: Published image / ${{ matrix.arch }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: manifest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke anonymously pulled release index
        env:
          RELEASE_IMAGE_STEP: smoke
          IMAGE: ${{ env.RELEASE_IMAGE }}@${{ needs.manifest.outputs.digest }}
          OLP_IMAGE_PLATFORM: ${{ matrix.platform }}
        run: make release-image

  chart:
    name: Helm chart
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Log in to GHCR for chart signing
        if: ${{ env.DRY_RUN != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: ${{ env.DRY_RUN != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Package and publish Helm chart
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          RELEASE_DIR: ${{ runner.temp }}/release-chart
        run: make release-chart
      - name: Upload Helm release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-chart
          path: ${{ runner.temp }}/release-chart
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  verify-published:
    name: Verify public signed artifacts
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: [manifest, smoke, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify public image signature
        env:
          RELEASE_MANIFEST_STEP: verify
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
        run: make release-manifest
      - name: Verify public chart and signature
        env:
          RELEASE_CHART_STEP: verify-public
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: make release-chart

  github-release:
    name: GitHub Release
    if: >-
      ${{
        always() &&
        needs.image.result == 'success' &&
        needs.manifest.result == 'success' &&
        needs.chart.result == 'success' &&
        (
          (github.event_name == 'workflow_dispatch' && inputs.dry_run &&
            needs.smoke.result == 'skipped' && needs.verify-published.result == 'skipped') ||
          (!(github.event_name == 'workflow_dispatch' && inputs.dry_run) &&
            needs.smoke.result == 'success' && needs.verify-published.result == 'success')
        )
      }}
    needs: [image, manifest, smoke, chart, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download architecture SBOMs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-sbom-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Download Helm release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-chart
          path: ${{ runner.temp }}/release
      - name: Download image index metadata
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: release-manifest-metadata
          path: ${{ runner.temp }}/release
      - name: Create GitHub Release
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: make release-notes

  promote:
    name: Publish release image aliases
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    needs: [manifest, github-release]
    concurrency:
      group: release-image-aliases
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified release image
        env:
          RELEASE_MANIFEST_STEP: promote
          IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
        run: make release-manifest
