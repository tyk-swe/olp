name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!skills-lock.json'
              - '!.agents/**'
              - '!.claude/**'
              - '!.devin/**'
              - '!.github/CODEOWNERS'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'openapi/**'
              - 'sdk/**'
              - 'tests/fidelity/**'
              - 'tests/fixtures/**'
              - 'scripts/bench-gate.sh'
              - 'scripts/check-benchstat.mjs'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - '!**/*.md'
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          services: false
          save-go-cache: true
      - run: make check GO_TEST_ARGS='-race -count=1'
      - run: ./scripts/check-contracts.sh --already-generated
      - run: node scripts/check-release-version.mjs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: ./scripts/check-helm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: management-contract
          path: openapi/management.json
          if-no-files-found: error
  ratchet:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: make test-ratchet RATCHET_BASE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: make test-coverage-gate RATCHET_BASE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: make api
      - run: make test-mutation-go test-mutation-console RATCHET_BASE="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-reports
          path: .local/mutation-go/*.json
          if-no-files-found: ignore
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        lanes: [qualification, a-f, g-m, n-z, smoke browser]
    # Ubuntu 26.04: its distribution bubblewrap carries the AppArmor profile the
    # official Codex sandbox needs under the unprivileged-userns restriction;
    # 24.04 lets the sandbox build its namespace but refuses it loopback.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          browser: ${{ contains(matrix.lanes, 'browser') }}
      - run: ./scripts/integration.sh ${{ matrix.lanes }}
      - if: contains(matrix.lanes, 'smoke')
        run: |
          ./tests/sdk-smoke-python/run.sh
          OLP_TEST_BINARY="$PWD/.local/bin/olp" ./tests/sdk-smoke/run.sh uv run --project tests/sdk-smoke-python --frozen python tests/sdk-smoke-python/client_env.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coding-client-releases-${{ matrix.lanes }}
          path: .local/codecli/evidence/
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && contains(matrix.lanes, 'browser')
        with:
          name: code-console-proof-${{ github.sha }}
          path: console/test-results/access/**/*.png
          if-no-files-found: warn
  dependencies:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: ./scripts/check-dependencies.sh
  bench:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          services: false
          node-modules: false
      - run: ./scripts/bench-gate.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          BENCH_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # One sample of every benchmark takes about two minutes at the default
          # benchtime and about 80 seconds at half a second, on an 8-vCPU
          # machine. Each shard takes ten samples of about a third of them on
          # each side, which is about 9 minutes at half a second before the
          # trees are compiled and a regression is measured again at twice that.
          BENCH_TIME: 500ms
          # A pull request that means to remove or rename a benchmark says so.
          BENCH_ALLOW_REMOVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow-removed-benchmarks') && '1' || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-gate-${{ matrix.shard }}
          path: .local/bench/gate
          if-no-files-found: ignore
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native candidate
        run: |
          mkdir -p .local/evidence
          docker build --progress=plain --platform linux/${{ matrix.arch }} -f deploy/Dockerfile -t olp:candidate . 2>&1 | tee .local/evidence/build.log
      - name: Qualify native candidate
        run: ./scripts/smoke-image-services.sh olp:candidate ${{ matrix.arch }} 2>&1 | tee .local/evidence/smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.arch }}
          path: .local/evidence
