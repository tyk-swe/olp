name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      console: ${{ github.event_name != 'pull_request' || steps.filter.outputs.console == 'true' }}
      contracts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.contracts == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
      scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!skills-lock.json'
              - '!.agents/**'
              - '!.claude/**'
              - '!.devin/**'
              - '!.github/CODEOWNERS'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'
            go:
              - 'scripts/check-lint.sh'
              - 'staticcheck.conf'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'cmd/**'
              - 'guardrails/**'
              - 'inference/**'
              - 'management/**'
              - 'plugin/**'
              - 'tests/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - '!**/*.md'
            console:
              - 'console/**'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - '!**/*.md'
            contracts:
              - 'guardrails/**'
              - 'inference/**'
              - 'management/**'
              - 'internal/management/**'
              - 'scripts/api.sh'
              - 'scripts/generate-*.mjs'
              - 'scripts/check-contracts.sh'
              - 'console/scripts/generate-requirements.mjs'
              - 'console/src/lib/management/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
              - '!**/*.md'
            helm:
              - 'deploy/helm/**'
              - 'deploy/monitoring/**'
              - 'scripts/check-helm.sh'
              - 'scripts/check-helm-egress.sh'
              - 'internal/**/*.go'
              - '.github/workflows/ci.yml'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/check-dependencies.sh'
              - 'scripts/native-sbom.py'
              - 'deploy/Dockerfile'
              - 'deploy/Dockerfile.*'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup/**'
            scripts:
              - 'scripts/**'
              - 'docs/**'
              - '**/*.md'
              - '.github/workflows/ci.yml'
  check-go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-modules: false
      - run: make fmt-check
      - run: make vet
      - run: make lint
  check-console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '>=10.26.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir console api:generate
      - run: pnpm --dir console format:check
      - run: pnpm --dir console check
  test-fast:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup
        with:
          go-cache-suffix: -test-fast
      - run: pnpm --dir console api:generate
      - run: make test-fast
      - if: ${{ failure() && steps.setup.outcome == 'success' && steps.setup.outputs.go-cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/staticcheck
          key: ${{ steps.setup.outputs.go-cache-key }}
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./scripts/check-contracts.sh
      - run: node scripts/check-release-version.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: management-contract
          path: management/management.json
          if-no-files-found: error
  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: ./scripts/check-helm.sh
  dependencies:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ./scripts/check-dependencies.sh
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make build
