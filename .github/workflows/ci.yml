name: CI

# Pull requests and merge queues run the required tier, including advisory
# audits and amd64 image validation. Cross-browser, HA, arm64, upgrade, and
# bounded fuzz campaigns remain in the post-merge/scheduled/manual full tier.
on:
  merge_group:
  pull_request:
  push:
    branches: [main, stable]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq ripgrep shellcheck
      - name: Lint GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --silent --show-error --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" \
            | sha256sum --check --status
          mkdir -p "$tool_dir"
          tar -xzf "$archive" --directory "$tool_dir" actionlint
          "$tool_dir/actionlint"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: deploy/Dockerfile
          failure-threshold: warning
      - name: Shellcheck every tracked shell script
        run: make shellcheck
      - name: Run script self-tests
        run: make script-selftest
      - name: Require consistent release metadata
        run: make release-version
      - name: Require immutable supply-chain references
        run: make supply-chain
      - name: Verify Helm and Compose contracts
        run: make helm-verify
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
          tools: "cargo-deny@0.20.2,cargo-machete@0.9.2"
      - name: Enforce advisories, bans, licenses, and sources
        run: make deny
      - name: Reject unused dependencies
        run: make machete

  lint:
    name: Rust / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          cache-shared-key: lint-registry
      - name: Install boundary-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Enforce crate boundaries
        run: make boundaries
      - name: Enforce typed storage access
        run: make storage-sqlx
      - name: Enforce source size rules
        run: make source-size
      - name: Check Rust formatting
        run: make fmt
      - name: Run Clippy
        run: make clippy

  coverage:
    name: Rust / coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: "true"
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7"
          cache-shared-key: coverage-registry
      - name: Run workspace coverage
        # test_support only executes under db-test; see the Makefile note.
        run: make coverage
      - name: Upload Rust coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 7

  fuzz-replay:
    name: Rust / fuzz replay
    runs-on: ubuntu-24.04
    # A cold sanitizer build is ~11min; replaying the seeded corpora is fast.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the pinned fuzz toolchain
        id: fuzz-toolchain
        # The Makefile's FUZZ_TOOLCHAIN is the source of truth for the pin;
        # include it in the shared registry cache key so nightly bumps start
        # with a fresh immutable entry.
        run: |
          toolchain="$(sed -n 's/^FUZZ_TOOLCHAIN := //p' Makefile)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: fuzz
          tools: "cargo-fuzz@0.13.2"
          cache-shared-key: fuzz-registry-${{ steps.fuzz-toolchain.outputs.toolchain }}
      - name: Compile fuzz targets
        run: make fuzz-check
      - name: Replay fuzz regression corpora
        run: make fuzz-replay

  console:
    name: Console / static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-dirs: console
      - name: Verify console
        working-directory: .
        run: make console-verify
      - name: Upload the console build for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/build
          retention-days: 1

  console-chromium:
    name: Console / Chromium
    needs: console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-dirs: console
      - name: Download the console build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: console-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/build
      - name: Install Chromium
        working-directory: .
        run: make playwright-install BROWSER=chromium
      - name: Run Chromium end-to-end tests
        working-directory: .
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/chromium
          PLAYWRIGHT_OUTPUT_DIR: test-results/chromium
        run: make console-e2e-project PROJECT=chromium
      - name: Upload Chromium Playwright diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-required-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  sdk-compatibility:
    name: SDK compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: tests/sdk-smoke/pnpm-lock.yaml
          install-dirs: tests/sdk-smoke
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: workspace-registry
          cache-save: "false"
      - name: Smoke official OpenAI, Anthropic, and Google GenAI SDKs
        # setup-node-pnpm already installed tests/sdk-smoke; skip make sdk-smoke's
        # install prerequisite.
        run: make sdk-smoke-run

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env: { POSTGRES_DB: olp, POSTGRES_USER: olp, POSTGRES_PASSWORD: olp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      OLP_TEST_DATABASE_ADMIN_URL: postgres://olp:olp@localhost:5432/postgres
      OLP_TEST_DATABASE_URL_PREFIX: postgres://olp:olp@localhost:5432
      OLP_TEST_DATABASE_OWNER: olp
      OLP_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          tools: "sqlx-cli@0.9.0,cargo-nextest@0.9.140"
          # Sole writer of the workspace registry/tool cache; the other consumers
          # (sdk-compatibility, rust-test-util-build, e2e, ha, worker-ha)
          # restore it read-only.
          cache-shared-key: workspace-registry
      - name: Install PostgreSQL 18 client tools
        run: ./scripts/ci/install-postgres-client.sh 18
      - name: Migrate the integration database
        env:
          DATABASE_URL: postgres://olp:olp@localhost:5432/olp
        run: make sqlx-migrate
      - name: Verify checked SQLx metadata
        run: make sqlx-check
      - name: Run isolated PostgreSQL and Valkey integration suites
        run: make db-test

  rust-test-util-build:
    name: Rust / test-util binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: workspace-registry
          cache-save: "false"
      # Built once here and shared as an artifact so console-integration, e2e,
      # ha, worker-ha, and upgrade-rehearsal do not each recompile the same
      # debug binary from source.
      - name: Build the olp binary with test-util
        run: make olp-build-test-util
      - name: Upload the olp binary for downstream jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug/olp
          retention-days: 1

  console-integration:
    name: Console / Rust integration
    needs: [console, rust-test-util-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env:
          POSTGRES_DB: olp_console_e2e
          POSTGRES_USER: olp
          POSTGRES_PASSWORD: olp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp_console_e2e"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      OLP_CONSOLE_E2E_DATABASE_URL: postgres://olp:olp@localhost:5432/olp_console_e2e
      OLP_CONSOLE_E2E_MASTER_KEY_FILE: /tmp/olp-console-e2e-master-key
      OLP_CONSOLE_E2E_AUTH_HMAC_KEY_FILE: /tmp/olp-console-e2e-auth-hmac-key
      OLP_CONSOLE_E2E_BOOTSTRAP_TOKEN_FILE: /tmp/olp-console-e2e-bootstrap-token
      OLP_CONSOLE_E2E_BIN: ${{ github.workspace }}/target/debug/olp
      OLP_VALKEY_URL: redis://localhost:6379
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/integration
      PLAYWRIGHT_OUTPUT_DIR: test-results/integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-dirs: console
      - name: Download the console build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: console-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/build
      - name: Install Chromium
        run: make playwright-install BROWSER=chromium
      - name: Download the prebuilt olp test-util binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug
      - name: Restore the execute bit on the downloaded binary
        run: make olp-prebuilt
      - name: Run complete Rust-hosted console integration
        run: make console-integration-prebuilt
      - name: Upload integration Playwright diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-console-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end contract
    needs: [postgres-integration, rust-test-util-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env: { POSTGRES_DB: olp, POSTGRES_USER: olp, POSTGRES_PASSWORD: olp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      OLP_E2E_DATABASE_ADMIN_URL: postgres://olp:olp@localhost:5432/postgres
      OLP_E2E_VALKEY_URL: redis://localhost:6379
      OLP_E2E_BIN: target/debug/olp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: workspace-registry
          cache-save: "false"
      - name: Install PostgreSQL 18 client tools
        run: ./scripts/ci/install-postgres-client.sh 18
      - name: Download the prebuilt olp test-util binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug
      - name: Restore the execute bit on the downloaded binary
        run: make olp-prebuilt
      - name: Run the end-to-end contract suite
        run: make e2e

  production-image:
    name: Production image / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Build final production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: openllmproxy:ci-amd64
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      - name: Smoke production binary modes and packaged console
        run: make smoke-image-modes IMAGE=openllmproxy:ci-amd64
      - name: Generate amd64 SBOM
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: openllmproxy:ci-amd64
          syft-version: v1.46.0
          format: spdx-json
          output-file: openllmproxy-amd64.spdx.json
          upload-artifact: false
      - name: Scan amd64 image for HIGH and CRITICAL vulnerabilities
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openllmproxy:ci-amd64
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload amd64 SBOM
        if: ${{ always() && !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openllmproxy-sbom-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: openllmproxy-amd64.spdx.json
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - lint
      - coverage
      - fuzz-replay
      - console
      - console-chromium
      - sdk-compatibility
      - postgres-integration
      - rust-test-util-build
      - console-integration
      - e2e
      - production-image
      - advisory-audits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every required-tier job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON" >/dev/null

  browser-compatibility:
    name: Console / ${{ matrix.label }}
    needs: console
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
            label: Firefox
          - project: webkit
            browser: webkit
            label: WebKit
          - project: mobile-chromium
            browser: chromium
            label: Mobile Chromium
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-dirs: console
      - name: Download the console build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: console-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: console/build
      - name: Install ${{ matrix.browser }}
        working-directory: .
        run: make playwright-install BROWSER=${{ matrix.browser }}
      - name: Run ${{ matrix.label }} end-to-end tests
        working-directory: .
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/${{ matrix.project }}
          PLAYWRIGHT_OUTPUT_DIR: test-results/${{ matrix.project }}
        run: make console-e2e-project PROJECT=${{ matrix.project }}
      - name: Upload ${{ matrix.label }} Playwright diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && !cancelled()
        with:
          name: playwright-full-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
          retention-days: 7

  ha:
    name: High availability
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: rust-test-util-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env: { POSTGRES_DB: olp, POSTGRES_USER: olp, POSTGRES_PASSWORD: olp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
        ports: ["8474:8474", "15432:15432", "16379:16379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: workspace-registry
          cache-save: "false"
      - name: Install PostgreSQL 18 client tools
        run: ./scripts/ci/install-postgres-client.sh 18
      - name: Download the prebuilt olp test-util binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug
      - name: Restore the execute bit on the downloaded binary
        run: make olp-prebuilt
      - name: Run two-gateway limits, LKG, missed-hint, and revocation proof
        env:
          OLP_E2E_DATABASE_ADMIN_URL: postgres://olp:olp@localhost:5432/postgres
          OLP_E2E_DATABASE_APP_ADMIN_URL: postgres://olp:olp@localhost:15432/postgres
          OLP_E2E_VALKEY_URL: redis://localhost:6379/0
          OLP_E2E_VALKEY_APP_URL: redis://localhost:16379/0
          OLP_E2E_TOXIPROXY_API: http://localhost:8474
          OLP_E2E_DATABASE_PROXY_NAME: olp-postgresql
          OLP_E2E_VALKEY_PROXY_NAME: olp-valkey
          OLP_E2E_BIN: target/debug/olp
          OLP_E2E_TEST_TARGET: ha
        run: |
          for _ in $(seq 1 100); do
            curl --fail --silent http://localhost:8474/version >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl --fail --silent --show-error http://localhost:8474/version >/dev/null
          curl --fail --silent --show-error -X POST http://localhost:8474/proxies \
            -H 'Content-Type: application/json' \
            --data '{"name":"olp-postgresql","listen":"0.0.0.0:15432","upstream":"postgres:5432"}'
          curl --fail --silent --show-error -X POST http://localhost:8474/proxies \
            -H 'Content-Type: application/json' \
            --data '{"name":"olp-valkey","listen":"0.0.0.0:16379","upstream":"valkey:6379"}'
          ./scripts/run-e2e-tests.sh

  worker-ha:
    name: Replicated worker qualification
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: rust-test-util-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env: { POSTGRES_DB: olp, POSTGRES_USER: olp, POSTGRES_PASSWORD: olp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-shared-key: workspace-registry
          cache-save: "false"
      - name: Install PostgreSQL 18 client tools
        run: ./scripts/ci/install-postgres-client.sh 18
      - name: Download the prebuilt olp test-util binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug
      - name: Restore the execute bit on the downloaded binary
        run: make olp-prebuilt
      - name: Run shared-Valkey and three-worker crash-recovery proofs
        env:
          OLP_E2E_DATABASE_ADMIN_URL: postgres://olp:olp@localhost:5432/postgres
          OLP_E2E_VALKEY_URL: redis://localhost:6379/0
          OLP_E2E_BIN: target/debug/olp
        run: make worker-ha

  upgrade-rehearsal:
    name: Backup / restore / upgrade
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: rust-test-util-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
        env: { POSTGRES_DB: olp, POSTGRES_USER: olp, POSTGRES_PASSWORD: olp }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U olp -d olp"
          --health-interval 2s --health-timeout 2s --health-retries 30
      valkey:
        image: valkey/valkey:9.1@sha256:4963247afc4cd33c7d3b2d2816b9f7f8eeebab148d29056c2ca4d7cbc966f2d9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      OLP_DATABASE_URL: postgres://olp:olp@localhost:5432/olp
      OLP_VALKEY_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PostgreSQL 18 client tools
        run: ./scripts/ci/install-postgres-client.sh 18
      - name: Download the prebuilt olp test-util binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: olp-test-util-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/debug
      - name: Restore the execute bit on the downloaded binary
        run: make olp-prebuilt
      # The rehearsal exercises the same debug binary the other harness jobs
      # use; test-util only adds harness hooks and leaves migrations untouched.
      - name: Migrate the current release
        run: make olp-migrate
      - name: Rehearse PostgreSQL backup, restore, and upgrade
        env:
          OLP_REHEARSAL_SERVER_URL: postgres://olp:olp@localhost:5432
          OLP_REHEARSAL_SCRATCH_DIR: ${{ runner.temp }}
          OLP_EXPECTED_PG_BINDIR: /usr/lib/postgresql/18/bin
          OLP_BIN: target/debug/olp
        run: make upgrade-rehearsal

  advisory-audits:
    name: Advisory audits
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache-dependency-path: |
            console/pnpm-lock.yaml
            tests/sdk-smoke/pnpm-lock.yaml
          install-dirs: console tests/sdk-smoke
      - name: Audit console and SDK smoke advisories
        # Cargo advisories are enforced by `make deny` in the quality job, which
        # reads its RUSTSEC exceptions from deny.toml.
        run: make advisories

  fuzz:
    name: Fuzz / bounded campaign
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # A cold sanitizer build is ~11min and the four bounded targets add 4x2min
    # of fuzzing, so the campaign needs well over 20min on an empty rust-cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive the pinned fuzz toolchain
        id: fuzz-toolchain
        # See the fuzz-replay job: the Makefile pin keys the shared registry cache.
        run: |
          toolchain="$(sed -n 's/^FUZZ_TOOLCHAIN := //p' Makefile)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          cache-workspaces: fuzz
          tools: "cargo-fuzz@0.13.2"
          # Keep registry/tool state read-only.
          cache-shared-key: fuzz-registry-${{ steps.fuzz-toolchain.outputs.toolchain }}
          cache-save: "false"
      - name: Run every seeded fuzz target for two minutes
        run: make fuzz-campaign

  image-arm64:
    name: Image / arm64
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - name: Build linux/arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: openllmproxy:ci-arm64
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64
      - name: Smoke final arm64 image modes and packaged console
        env:
          OLP_IMAGE_PLATFORM: linux/arm64
        run: make smoke-image-modes IMAGE=openllmproxy:ci-arm64
      - name: Generate arm64 SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: openllmproxy:ci-arm64
          syft-version: v1.46.0
          format: spdx-json
          output-file: openllmproxy-arm64.spdx.json
          upload-artifact: false
      - name: Scan arm64 image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openllmproxy:ci-arm64
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Upload arm64 SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: openllmproxy-sbom-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: openllmproxy-arm64.spdx.json
          if-no-files-found: ignore
          retention-days: 7

  full:
    name: Full
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs:
      # `required` transitively covers the whole required tier; list only it
      # plus the full-tier-only jobs.
      - required
      - browser-compatibility
      - ha
      - worker-ha
      - upgrade-rehearsal
      - fuzz
      - image-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every required and full-tier job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON" >/dev/null
