name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: make check GO_TEST_ARGS='-race -count=1'
      - run: ./scripts/check-contracts.sh --already-generated
      - run: node scripts/check-release-version.mjs
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: ./scripts/check-helm.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: management-contract
          path: openapi/management.json
          if-no-files-found: error
  integration:
    # Ubuntu 26.04: its distribution bubblewrap carries the AppArmor profile the
    # official Codex sandbox needs under the unprivileged-userns restriction;
    # 24.04 lets the sandbox build its namespace but refuses it loopback.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: make integration
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: ./scripts/check-dependencies.sh
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: ./scripts/bench-gate.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          # One sample of every benchmark takes about two minutes at the default
          # benchtime and about 80 seconds at half a second, on an 8-vCPU
          # machine, and the job takes ten of them on each side, which is about
          # 26 minutes at half a second before the trees are compiled and a
          # regression is measured again at twice that. A slower runner needs
          # the hour.
          BENCH_TIME: 500ms
          # A pull request that means to remove or rename a benchmark says so.
          BENCH_ALLOW_REMOVED: ${{ contains(github.event.pull_request.labels.*.name, 'allow-removed-benchmarks') && '1' || '0' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: bench-gate
          path: .local/bench/gate
          if-no-files-found: ignore
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native candidate
        run: |
          mkdir -p .local/evidence
          docker build --progress=plain --platform linux/${{ matrix.arch }} -f deploy/Dockerfile -t olp:candidate . 2>&1 | tee .local/evidence/build.log
      - name: Qualify native candidate
        run: ./scripts/smoke-image-services.sh olp:candidate ${{ matrix.arch }} 2>&1 | tee .local/evidence/smoke.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: native-${{ matrix.arch }}
          path: .local/evidence
