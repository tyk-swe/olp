name: Qualify code live
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify-code-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install client sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y apparmor bubblewrap
          if ! bwrap --unshare-net --unshare-pid --ro-bind / / /usr/bin/true; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile olp-qualification-bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' > "$RUNNER_TEMP/olp-qualification-bwrap"
            sudo apparmor_parser -r "$RUNNER_TEMP/olp-qualification-bwrap"
          fi
          bwrap --unshare-net --unshare-pid --ro-bind / / /usr/bin/true
      - name: Install latest coding clients
        run: |
          npm install --global --ignore-scripts @openai/codex@latest @anthropic-ai/claude-code@latest opencode-ai@latest
          npm_root=$(npm root --global)
          mkdir -p "$RUNNER_TEMP/qualification-clients"
          ln -s "$npm_root/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex" "$RUNNER_TEMP/qualification-clients/codex"
          ln -s "$npm_root/@anthropic-ai/claude-code/node_modules/@anthropic-ai/claude-code-linux-x64/claude" "$RUNNER_TEMP/qualification-clients/claude"
          ln -s "$npm_root/opencode-ai/node_modules/opencode-linux-x64/bin/opencode" "$RUNNER_TEMP/qualification-clients/opencode"
          printf '%s\n' "$RUNNER_TEMP/qualification-clients" >> "$GITHUB_PATH"
      - name: Run live qualification lanes
        env:
          OLP_LIVE_CODEX_AUTH_JSON: ${{ secrets.OLP_LIVE_CODEX_AUTH_JSON }}
          OLP_LIVE_CODEX_AUTH_JSON_2: ${{ secrets.OLP_LIVE_CODEX_AUTH_JSON_2 }}
          OLP_LIVE_CODEX_MODEL: ${{ secrets.OLP_LIVE_CODEX_MODEL }}
          OLP_LIVE_GLM_GLOBAL_KEY: ${{ secrets.OLP_LIVE_GLM_GLOBAL_KEY }}
          OLP_LIVE_GLM_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_GLM_GLOBAL_MODEL }}
          OLP_LIVE_GLM_CN_KEY: ${{ secrets.OLP_LIVE_GLM_CN_KEY }}
          OLP_LIVE_GLM_CN_MODEL: ${{ secrets.OLP_LIVE_GLM_CN_MODEL }}
          OLP_LIVE_MINIMAX_GLOBAL_KEY: ${{ secrets.OLP_LIVE_MINIMAX_GLOBAL_KEY }}
          OLP_LIVE_MINIMAX_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_MINIMAX_GLOBAL_MODEL }}
          OLP_LIVE_MINIMAX_CN_KEY: ${{ secrets.OLP_LIVE_MINIMAX_CN_KEY }}
          OLP_LIVE_MINIMAX_CN_MODEL: ${{ secrets.OLP_LIVE_MINIMAX_CN_MODEL }}
          OLP_LIVE_KIMI_GLOBAL_KEY: ${{ secrets.OLP_LIVE_KIMI_GLOBAL_KEY }}
          OLP_LIVE_KIMI_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_KIMI_GLOBAL_MODEL }}
          OLP_LIVE_KIMI_CN_KEY: ${{ secrets.OLP_LIVE_KIMI_CN_KEY }}
          OLP_LIVE_KIMI_CN_MODEL: ${{ secrets.OLP_LIVE_KIMI_CN_MODEL }}
          OLP_LIVE_QWEN_GLOBAL_KEY: ${{ secrets.OLP_LIVE_QWEN_GLOBAL_KEY }}
          OLP_LIVE_QWEN_GLOBAL_MODEL: ${{ secrets.OLP_LIVE_QWEN_GLOBAL_MODEL }}
          OLP_LIVE_QWEN_CN_KEY: ${{ secrets.OLP_LIVE_QWEN_CN_KEY }}
          OLP_LIVE_QWEN_CN_MODEL: ${{ secrets.OLP_LIVE_QWEN_CN_MODEL }}
          OLP_LIVE_OPENCODE_GO_KEY: ${{ secrets.OLP_LIVE_OPENCODE_GO_KEY }}
          OLP_LIVE_OPENCODE_GO_MODEL: ${{ secrets.OLP_LIVE_OPENCODE_GO_MODEL }}
        run: make qualify-code-live
