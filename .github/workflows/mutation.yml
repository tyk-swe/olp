name: Mutation report
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  report:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          services: false
      - run: make api
      - name: Mutation-test every Go package
        continue-on-error: true
        run: ./scripts/mutation-go.sh --all
      - name: Mutation-test every console module in scope
        continue-on-error: true
        run: |
          mkdir -p console/reports
          pnpm --dir console test:mutation 2>&1 | tee console/reports/mutation-console.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-full-report
          path: |
            .local/mutation-go/*.json
            console/reports/mutation-console.txt
          if-no-files-found: ignore
