name: Go foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: go-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/go-without-rust.sh make go-check
      - run: ./scripts/check-go-contracts.sh
      - run: pnpm --dir console exec playwright install --with-deps chromium
      - run: ./scripts/go-without-rust.sh make go-integration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: go-foundation-browser
          path: console/test-results/go-foundation
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native candidate without Rust
        run: |
          mkdir -p .local/evidence
          docker build --progress=plain --platform linux/${{ matrix.arch }} -f deploy/go.Dockerfile -t olp-go:candidate . 2>&1 | tee .local/evidence/build.log
      - name: Qualify native candidate
        run: ./scripts/go-image-smoke.sh olp-go:candidate ${{ matrix.arch }} 2>&1 | tee .local/evidence/smoke.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: go-native-${{ matrix.arch }}
          path: .local/evidence
