name: MinIO qualification image
on:
  pull_request:
    paths:
      - deploy/Dockerfile.minio-qualification
      - .github/workflows/minio-qualification.yml
  push:
    branches: [main]
    paths:
      - deploy/Dockerfile.minio-qualification
      - .github/workflows/minio-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and start the qualification image
        run: |
          docker build -f deploy/Dockerfile.minio-qualification -t olp-minio-qualification deploy
          docker run -d --name olp-minio-qualification --entrypoint /bin/sh olp-minio-qualification -c 'mkdir -p /data/langfuse && exec minio server --address ":9000" /data'
          trap 'docker rm -f olp-minio-qualification >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker exec olp-minio-qualification curl --fail --silent http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs olp-minio-qualification
          exit 1
