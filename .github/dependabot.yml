version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
        # Keep futures standalone until dependabot-core#16092 fixes lockstep updates.
        exclude-patterns: [futures]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
    groups:
      console-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /tests/sdk-smoke
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    # The console-build stage stays on the Node LTS line CI actually tests:
    # .github/actions/setup-node-pnpm pins node-version 24; the SDK smoke
    # package accepts Node >=24, while the console requires a jsdom-compatible
    # Node 24 patch (or Node >=26). Majors past 24 also drop the bundled
    # corepack that stage's `corepack enable` depends on, so a major bump here
    # is a deliberate, repo-wide change rather than a dependency refresh.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
