name: Feature request
description: Propose new behavior for the gateway, console, or deployment.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen instead, from the user's point of view.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Gateway API surfaces
        - Routing / providers / certification
        - Keys, limits, usage, pricing
        - Console
        - Deployment (Compose / Helm)
        - Observability / operations
        - other (describe above)
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
