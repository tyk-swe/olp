name: Set up toolchain
description: Install stable Go and Node toolchains and console dependencies.
inputs:
  node-modules:
    description: Install the pnpm workspace.
    default: "true"
  go-cache-suffix:
    description: Distinguish jobs that build different Go artifacts.
    default: ""
outputs:
  go-cache-key:
    description: The Go build cache key for this toolchain and runner image.
    value: ${{ steps.go-cache.outputs.key }}
  go-cache-hit:
    description: Whether the exact Go cache key was restored.
    value: ${{ steps.go-build-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      id: go
      with:
        go-version: stable
        cache: false
    - id: go-cache
      shell: bash
      env:
        GO_VERSION: ${{ steps.go.outputs.go-version }}
        GO_SUM: ${{ hashFiles('**/go.sum') }}
        GO_CACHE_SUFFIX: ${{ inputs.go-cache-suffix }}
      run: |
        prefix="go-$ImageOS-$RUNNER_ARCH-$GO_VERSION-"
        {
          echo "prefix=$prefix"
          echo "key=$prefix$ImageVersion-$GO_SUM$GO_CACHE_SUFFIX"
        } >> "$GITHUB_OUTPUT"
    - id: go-build-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/staticcheck
        key: ${{ steps.go-cache.outputs.key }}
        restore-keys: ${{ steps.go-cache.outputs.prefix }}
    - shell: bash
      run: go mod download
    - if: inputs.node-modules == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '>=10.26.0'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.node-modules == 'true' && 'pnpm' || '' }}
    - if: inputs.node-modules == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
