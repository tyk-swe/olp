name: Set up qualification tools
description: Install the pinned Go toolchain and native prerequisites, console dependencies and PostgreSQL client.
inputs:
  services:
    description: Install the PostgreSQL client and Chromium needed by integration suites.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ca-certificates
        go mod download
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.services == 'true'
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.10"
        enable-cache: false
    - if: inputs.services == 'true'
      shell: bash
      run: uv python install 3.14
    - if: inputs.services == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
        pnpm --dir console exec playwright install --with-deps chromium
