name: Set up qualification tools
description: Install the pinned Rust toolchain, console dependencies and PostgreSQL client.
inputs:
  services:
    description: Install the PostgreSQL client and Chromium needed by integration suites.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 26
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - if: inputs.services == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install -y postgresql-client-18
        pnpm --dir console exec playwright install --with-deps chromium
