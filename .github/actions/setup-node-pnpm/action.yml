name: Setup Node and pnpm
description: >-
  Pinned pnpm and Node 24 with the pnpm store cache, optionally installing
  locked dependencies. Keep the action SHAs below in lockstep with
  scripts/check-supply-chain-pins.sh.

inputs:
  cache-dependency-path:
    description: Lockfile path(s) for the pnpm store cache key
    default: console/pnpm-lock.yaml
  install-dirs:
    description: >-
      Space-separated directories to run `pnpm install --frozen-lockfile` in;
      empty skips installation
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      with: { version: 11.10.0 }
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - if: ${{ inputs.install-dirs != '' }}
      name: Install locked dependencies
      shell: bash
      env:
        INSTALL_DIRS: ${{ inputs.install-dirs }}
      run: |
        for dir in $INSTALL_DIRS; do
          pnpm --dir "$dir" install --frozen-lockfile
        done
