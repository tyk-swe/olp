name: Setup Rust
description: >-
  Clang/LLD linker, pinned Rust toolchain, sccache, Cargo registry/tool cache,
  and optional cargo tools. Keep the action SHAs below in lockstep with
  scripts/check-supply-chain-pins.sh.

inputs:
  components:
    description: Comma-separated rustup components
    default: ""
  cache:
    description: Whether to enable sccache and restore/save the Cargo registry/tool cache
    default: "true"
  cache-workspaces:
    description: Newline-separated workspaces used to key the Cargo registry/tool cache
    default: "."
  cache-shared-key:
    description: >-
      rust-cache shared-key. Jobs passing the same value restore one shared
      registry/tool cache instead of a per-job one; designate exactly one of
      them as the writer (cache-save "true") because GitHub cache entries are
      immutable.
    default: ""
  cache-save:
    description: Whether this job saves the Cargo registry/tool cache on a miss
    default: "true"
  tools:
    description: Comma-separated tool@version list for taiki-e/install-action
    default: ""

runs:
  using: composite
  steps:
    - name: Install Clang and LLD linker
      shell: bash
      run: |
        if ! command -v clang >/dev/null 2>&1 || ! command -v ld.lld >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld
        fi
    - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
      with:
        toolchain: "1.97.1"
        components: ${{ inputs.components }}
    - if: ${{ inputs.cache == 'true' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: "v0.17.0"
    - name: Enable the GitHub Actions sccache backend
      if: ${{ inputs.cache == 'true' }}
      shell: bash
      run: echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
    - name: Disable the repository compiler wrapper
      if: ${{ inputs.cache != 'true' }}
      shell: bash
      run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
    - if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      with:
        cache-on-failure: true
        cache-targets: false
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.cache-shared-key }}
        save-if: ${{ inputs.cache-save }}
    - if: ${{ inputs.tools != '' }}
      uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
      with:
        tool: ${{ inputs.tools }}
