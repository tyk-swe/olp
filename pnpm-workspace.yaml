packages:
  - console

engineStrict: false

allowBuilds:
  esbuild: true

# The OpenAPI generator pins a vulnerable YAML parser; use its fixed patch.
overrides:
  js-yaml@4.3.1: 4.3.2
  # svelte and @sveltejs/kit admit the fixed release but resolve to an earlier
  # one with six published advisories; pin the fix.
  devalue: 5.9.4
