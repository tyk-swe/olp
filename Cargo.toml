[workspace]
resolver = "3"
members = [
    "apps/olp",
    "crates/olp-db",
    "crates/olp-engine",
    "tests/conformance",
    "tests/e2e",
]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/tyk-swe/olp"

[workspace.dependencies]
aes-gcm = "0.11"
arc-swap = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["http2", "json", "multipart", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "service", "tokio"] }
ipnet = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
percent-encoding = "2"
proptest = "1"
rand = "0.9"
redis = { version = "1.4", features = ["aio", "connection-manager", "streams", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "stream", "rustls"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "rust_decimal",
    "tls-rustls-ring",
    "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7", features = [
    "catch-panic",
    "fs",
    "request-id",
    "sensitive-headers",
    "set-header",
    "timeout",
    "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
zeroize = { version = "1", features = ["derive"] }

olp-db = { path = "crates/olp-db", version = "2.1.0" }
olp-engine = { path = "crates/olp-engine", version = "2.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
# Full DWARF made each integration test binary hundreds of MB and dominated
# link time; line tables keep file:line backtraces. For debugger sessions
# needing variable info, override in ~/.cargo/config.toml ([profile.dev]
# debug = 2) — see CONTRIBUTING.md.
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Debug-mode Argon2id (m=19456, t=2; crates/olp-db/src/security/passwords.rs) runs
# dozens of times across the DB suites; keep hot crypto crates optimized.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
