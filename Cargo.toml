[package]
name = "olp"
description = "OpenLLMProxy AI gateway and control plane"
version = "3.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/tyk-swe/olp"
autotests = false

[features]
test-util = []

[dependencies]
aws-config = { version = "1.12.0", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-credential-types = "1.3.0"
aws-sdk-bedrock = { version = "1.155.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-bedrockruntime = { version = "1.143.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-runtime-api = "1.16.0"
google-cloud-auth = "1.16.0"
utoipa-axum = "0.2.0"

[dependencies.aes-gcm]
version = "0.11.1"

[dependencies.arc-swap]
version = "1.9.2"

[dependencies.argon2]
version = "0.6.0"

[dependencies.aws-smithy-types]
version = "1.6.3"

[dependencies.axum]
version = "0.8.9"
features = ["http2", "json", "multipart", "tokio"]

[dependencies.base64]
version = "0.23.1"

[dependencies.bytes]
version = "1.12.1"

[dependencies.chrono]
version = "0.4.45"
features = ["serde"]

[dependencies.clap]
version = "4.6.6"
features = ["derive", "env"]

[dependencies.flate2]
version = "1.1.10"
default-features = false
features = ["rust_backend"]

[dependencies.futures]
version = "0.3.34"

[dependencies.hmac]
version = "0.13.0"

[dependencies.http]
version = "1.5.0"

[dependencies.http-body]
version = "1.1.0"

[dependencies.hyper]
version = "1.11.1"
features = ["http1", "http2", "server"]

[dependencies.hyper-util]
version = "0.1.20"
features = ["http1", "http2", "server", "server-auto", "service", "tokio"]

[dependencies.ipnet]
version = "2.12.2"

[dependencies.jsonwebtoken]
version = "11.0.0"
default-features = false
features = ["aws_lc_rs", "use_pem"]

[dependencies.opentelemetry]
version = "0.32.0"
default-features = false
features = ["trace"]

[dependencies.opentelemetry-http]
version = "0.32.0"
default-features = false

[dependencies.opentelemetry-otlp]
version = "0.32.0"
default-features = false
features = ["http-proto", "reqwest-client", "trace"]

[dependencies.opentelemetry_sdk]
version = "0.32.1"
default-features = false
features = ["trace"]

[dependencies.percent-encoding]
version = "2.3.2"

[dependencies.rand]
version = "0.10.2"

[dependencies.redis]
version = "1.7.0"
features = ["aio", "connection-manager", "streams", "tokio-comp"]

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["form", "json", "multipart", "rustls", "stream"]

[dependencies.rust_decimal]
version = "1.43.0"
features = ["serde"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.151"

[dependencies.serde_path_to_error]
version = "0.1.20"

[dependencies.sha2]
version = "0.11.0"

[dependencies.sqlx]
version = "0.9.0"
default-features = false
features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "rust_decimal", "tls-rustls-ring", "uuid"]

[dependencies.thiserror]
version = "2.0.20"

[dependencies.tokio]
version = "1.53.1"
features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"]

[dependencies.tower]
version = "0.5.3"
features = ["limit", "load-shed", "timeout", "util"]

[dependencies.tower-http]
version = "0.7.1"
features = ["catch-panic", "cors", "fs", "request-id", "sensitive-headers", "set-header", "timeout", "trace"]

[dependencies.tracing]
version = "0.1.44"

[dependencies.tracing-opentelemetry]
version = "0.33.0"
default-features = false

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter", "json"]

[dependencies.url]
version = "2.5.8"
features = ["serde"]

[dependencies.utoipa]
version = "5.5.0"
features = ["chrono", "uuid"]

[dependencies.uuid]
version = "1.26.0"
features = ["serde", "v7"]

[dependencies.zeroize]
version = "1.9.0"
features = ["derive"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[dev-dependencies.aws-smithy-eventstream]
version = "0.61.2"

[dev-dependencies.http-body-util]
version = "0.1.5"

[dev-dependencies.opentelemetry-proto]
version = "0.32.0"
default-features = false
features = ["gen-tonic-messages", "trace"]

[dev-dependencies.proptest]
version = "1.11.0"

[dev-dependencies.prost]
version = "0.14.4"

[dev-dependencies.tokio]
version = "1.53.1"
features = ["test-util"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.test]
debug = false
incremental = false
[[test]]
name = "system"
path = "tests/system/main.rs"
required-features = ["test-util"]

[[test]]
name = "persistence"
path = "tests/persistence/main.rs"
required-features = ["test-util"]

[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
required-features = ["test-util"]

[[test]]
name = "contract"
path = "tests/contract.rs"
required-features = ["test-util"]

[[test]]
name = "ha"
path = "tests/ha.rs"
required-features = ["test-util"]

[[test]]
name = "anthropic_messages"
path = "tests/protocols/anthropic_messages.rs"
[[test]]
name = "codec_properties"
path = "tests/protocols/codec_properties.rs"
[[test]]
name = "domain"
path = "tests/protocols/domain.rs"
[[test]]
name = "domain_codecs"
path = "tests/protocols/domain_codecs.rs"
[[test]]
name = "gemini_generate_content"
path = "tests/protocols/gemini_generate_content.rs"
[[test]]
name = "openai_chat"
path = "tests/protocols/openai_chat.rs"
[[test]]
name = "openai_operations"
path = "tests/protocols/openai_operations.rs"
[[test]]
name = "sse"
path = "tests/protocols/sse.rs"
[[example]]
name = "sdk_smoke_fixture"
required-features = ["test-util"]

[[bench]]
name = "protocols"
harness = false
