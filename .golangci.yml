version: "2"
run:
  build-tags: [integration, e2e, qualification, qualificationlive]
linters:
  default: none
  enable: [depguard, errorlint, funlen, ineffassign, paralleltest, revive, staticcheck, unconvert, unused, wastedassign]
  settings:
    staticcheck:
      checks: [SA4006, SA4009, S1011, S1017, S1021, ST1012, ST1013, ST1019, ST1023]
    errorlint:
      errorf: false
      allowed-errors:
        - err: io.EOF
          fun: (*mime/multipart.Reader).NextPart
        - err: io.EOF
          fun: (*mime/multipart.Reader).NextRawPart
        - err: io.EOF
          fun: (*encoding/xml.Decoder).Token
        - err: io.EOF
          fun: (*github.com/tyk-swe/olp/internal/domain/protocols/sse.Decoder).Next
        - err: io.EOF
          fun: (*github.com/tyk-swe/olp/internal/domain/protocols/sse.RawDecoder).Next
        - err: bufio.ErrBufferFull
          fun: (*bufio.Reader).ReadSlice
    funlen:
      lines: 100
      statements: -1
      ignore-comments: true
    paralleltest:
      ignore-missing-subtests: true
    revive:
      rules:
        - name: file-length-limit
          arguments: [{ max: 500, skipComments: true, skipBlankLines: true }]
    depguard:
      rules:
        serving:
          files: ["**/internal/gateway/**", "!$test"]
          deny:
            - pkg: github.com/tyk-swe/olp/internal/access$
              desc: The gateway serves inference and must not depend on the management kit. Pass what it needs in through cmd/olp.
        management:
          files: ["**/internal/access/**", "!$test"]
          deny:
            - pkg: github.com/tyk-swe/olp/internal/gateway
              desc: The management kit must not depend on the gateway. Wire the two together in cmd/olp.
        kernel:
          files: ["**/internal/gateway/kernel/**", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: The execution kernel must not own SQL or database transactions. Move persistence into the owning store package.
            - pkg: github.com/tyk-swe/olp/internal/access/httpkit
              desc: The execution kernel serves inference and must not import management HTTP types. Convert faults in cmd/olp.
            - pkg: github.com/tyk-swe/olp/internal/access/authz
              desc: The execution kernel must not import management principals. Pass an authorization callback through Member from cmd/olp.
        gateway_isolation:
          files: ["**/internal/**", "!**/internal/gateway/**", "!$test"]
          deny:
            - pkg: github.com/tyk-swe/olp/internal/gateway
              desc: Only cmd packages wire features to the gateway. Pass a narrow collaborator in through cmd/olp.
        domain:
          files: ["**/internal/domain/**", "!$test"]
          list-mode: lax
          allow:
            - github.com/tyk-swe/olp/internal/domain
            - github.com/tyk-swe/olp/internal/catalog$
          deny:
            - pkg: github.com/tyk-swe/olp/internal
              desc: internal/domain is pure vocabulary and logic. It imports only internal/domain, plus the signed reference catalog.
            - pkg: net/http
              desc: internal/domain does no I/O. Take the value in as an argument and do the request in the caller.
            - pkg: database/sql
              desc: internal/domain does no I/O. Query in the feature that owns the table.
            - pkg: github.com/jackc/pgx
              desc: internal/domain does no I/O. Query in the feature that owns the table.
            - pkg: github.com/valkey-io
              desc: internal/domain does no I/O. Read the shared state in the caller.
        platform:
          files: ["**/internal/platform/**", "!$test"]
          list-mode: lax
          allow:
            - github.com/tyk-swe/olp/internal/platform
            - github.com/tyk-swe/olp/internal/domain
          deny:
            - pkg: github.com/tyk-swe/olp/internal
              desc: internal/platform is infrastructure that every feature builds on, so it must not import a feature.
        library:
          files: ["**/internal/**"]
          deny:
            - pkg: github.com/tyk-swe/olp/cmd
              desc: Only cmd packages wire the process. Move shared code into internal.
  exclusions:
    rules:
      - path: _test\.go$
        linters: [funlen, revive]
      - path: \.gen\.go$
        linters: [funlen, revive]
      - path: _test\.go$
        linters: [errorlint]
      - path-except: ^tests/(integration|e2e)/
        linters: [paralleltest]
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
