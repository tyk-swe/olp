[package]
name = "olp-engine"
description = "Domain, protocols, provider transports, and inference engine for OpenLLMProxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.olp]
role = "engine"

[features]
test-util = []

[dependencies]
arc-swap.workspace = true
aws-config = { version = "1.10.0", default-features = false, features = [
    "behavior-version-latest",
    "credentials-process",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-credential-types = "1.3.0"
aws-sdk-bedrock = { version = "1.149.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-bedrockruntime = { version = "1.137.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-runtime-api = "1.14.0"
aws-smithy-types.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
google-cloud-auth = "1.13"
http.workspace = true
ipnet.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"] }
opentelemetry.workspace = true
opentelemetry-http.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
url.workspace = true
utoipa.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
aws-smithy-eventstream.workspace = true
criterion = "0.7"
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "protocols"
harness = false

[lints]
workspace = true
