[package]
name = "olp-db"
description = "PostgreSQL, Valkey, encryption, and migration infrastructure for OpenLLMProxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.olp]
role = "db"

[features]
# Test-only helpers (per-test database provisioning). Never enabled by
# production dependents; the repository gates build with --all-features.
test-util = []

# The integration binary uses olp_db::test_support, so it only builds
# when the feature is on; a plain `cargo test -p olp-db` skips it.
[[test]]
name = "integration"
required-features = ["test-util"]

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
hmac.workspace = true
olp-engine.workspace = true
rand.workspace = true
redis.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
olp-engine = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
