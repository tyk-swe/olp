# Workspace nextest configuration.
#   default — local `make test`
#   ci      — CI runs (NEXTEST_PROFILE=ci): keep going past failures
#   db      — scripts/run-postgres-tests.sh PostgreSQL/Valkey suites
# Retries stay at 0 in every profile except live. A test that fails once gets
# an issue instead of an automatic retry.

[profile.default]
fail-fast = true
retries = 0

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
retries = 0

[profile.db]
fail-fast = false
retries = 0
# Each test owns a database pool plus a debug-mode Argon2 workload; bound
# the fan-out instead of scaling with host cores.
test-threads = 4
# Replaces the old shell-level `timeout 900`: report a test as slow after
# 2 minutes and kill it after 5 periods (10 minutes).
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.live]
fail-fast = false
failure-output = "immediate-final"
retries = 1
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.live.junit]
path = "junit.xml"
