name: openllmproxy

x-database-environment: &database-environment
  OLP_DATABASE_URL: ${OLP_DATABASE_URL:-postgres://olp@postgres:5432/olp}
  OLP_DATABASE_PASSWORD_FILE: /run/olp/secrets/postgres_password
  OLP_DATABASE_PASSWORD_FILE_URL: postgres://olp@postgres:5432/olp
  OLP_DATABASE_MAX_CONNECTIONS: ${OLP_DATABASE_MAX_CONNECTIONS:-20}

x-application-environment: &application-environment
  <<: *database-environment
  OLP_LISTEN_ADDR: 0.0.0.0:8080
  # Kept inside the Compose network: port 9090 is intentionally not listed
  # under the application's host-published ports.
  OLP_OBSERVABILITY_LISTEN_ADDR: 0.0.0.0:9090
  OLP_HTTP_MAX_CONNECTIONS: ${OLP_HTTP_MAX_CONNECTIONS:-1024}
  OLP_HTTP_MAX_IN_FLIGHT_INFERENCE_REQUESTS: ${OLP_HTTP_MAX_IN_FLIGHT_INFERENCE_REQUESTS:-256}
  OLP_HTTP_MAX_IN_FLIGHT_MANAGEMENT_REQUESTS: ${OLP_HTTP_MAX_IN_FLIGHT_MANAGEMENT_REQUESTS:-32}
  OLP_HTTP_CONNECTION_MAX_AGE_SECONDS: ${OLP_HTTP_CONNECTION_MAX_AGE_SECONDS:-300}
  OLP_HTTP_CONNECTION_DRAIN_TIMEOUT_SECONDS: ${OLP_HTTP_CONNECTION_DRAIN_TIMEOUT_SECONDS:-30}
  OLP_VALKEY_URL: ${OLP_VALKEY_URL:-redis://valkey:6379}
  OLP_CACHE_VALKEY_URL: ${OLP_CACHE_VALKEY_URL:-}
  OLP_PUBLIC_ORIGIN: ${OLP_PUBLIC_ORIGIN:-http://localhost:${OLP_HOST_PORT:-8080}}
  OLP_LOCAL_LOGIN_ENABLED: ${OLP_LOCAL_LOGIN_ENABLED:-true}
  # Experimental. The directory of OLP_IMAGE that holds unconfined plugin
  # executables; setting it enables the unconfined plugin tier. Empty runs
  # plugins confined only.
  OLP_UNCONFINED_PLUGIN_DIR: ${OLP_UNCONFINED_PLUGIN_DIR:-}
  # Empty means forwarding headers are ignored. Set only to CIDRs of proxies
  # that append a trustworthy X-Forwarded-For chain.
  OLP_TRUSTED_PROXY_CIDRS: ${OLP_TRUSTED_PROXY_CIDRS:-}
  OLP_GATEWAY_CORS_ALLOWED_ORIGINS: ${OLP_GATEWAY_CORS_ALLOWED_ORIGINS:-}
  OLP_PROVIDER_EGRESS_ALLOW_CIDRS: ${OLP_PROVIDER_EGRESS_ALLOW_CIDRS:-}
  OLP_PROVIDER_EGRESS_ALLOW_HTTP_HOSTS: ${OLP_PROVIDER_EGRESS_ALLOW_HTTP_HOSTS:-}
  OLP_HTTP_MAX_JSON_BODY_BYTES: ${OLP_HTTP_MAX_JSON_BODY_BYTES:-2097152}
  OLP_HTTP_MAX_MEDIA_BODY_BYTES: ${OLP_HTTP_MAX_MEDIA_BODY_BYTES:-67108864}
  OLP_HTTP_MAX_INLINE_MEDIA_ITEMS: ${OLP_HTTP_MAX_INLINE_MEDIA_ITEMS:-4}
  OLP_HTTP_MAX_INLINE_MEDIA_ITEM_BYTES: ${OLP_HTTP_MAX_INLINE_MEDIA_ITEM_BYTES:-1048576}
  OLP_HTTP_MAX_INLINE_MEDIA_TOTAL_BYTES: ${OLP_HTTP_MAX_INLINE_MEDIA_TOTAL_BYTES:-2097152}
  OLP_PROVIDER_MAX_RESPONSE_BYTES: ${OLP_PROVIDER_MAX_RESPONSE_BYTES:-16777216}
  OLP_PROVIDER_MAX_EVENT_BYTES: ${OLP_PROVIDER_MAX_EVENT_BYTES:-1048576}
  OLP_CONSOLE_DIR: /opt/olp/console
  OLP_MEDIA_SPOOL_DIR: /var/lib/olp/media
  OLP_MEDIA_SPOOL_CAPACITY_BYTES: ${OLP_MEDIA_SPOOL_CAPACITY_BYTES:-1073741824}
  OLP_MASTER_KEY_FILE: /run/olp/secrets/olp_master_key
  OLP_AUTH_HMAC_KEY_FILE: /run/olp/secrets/olp_auth_hmac_key
  OLP_BOOTSTRAP_TOKEN_FILE: /run/olp/secrets/olp_bootstrap_token
  OLP_LOG_LEVEL: ${OLP_LOG_LEVEL:-info}

x-olp-container: &olp-container
  image: ${OLP_IMAGE:-ghcr.io/tyk-swe/olp:0.2.0}
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    # The application admits up to 50 MiB per image part. Keep a bounded 1-GiB
    # application budget inside a 2-GiB filesystem so concurrent accepted
    # uploads have explicit headroom for filesystem metadata and in-flight I/O.
    - /var/lib/olp/media:size=2g,mode=0700,uid=65532,gid=65532
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

services:
  init-secrets:
    <<: *olp-container
    command: ["init-secrets", "--dir", "/run/olp/secrets", "--database-dir", "/run/olp/database"]
    volumes:
      - olp-secrets:/run/olp/secrets
      - olp-database-secret:/run/olp/database
    restart: "no"

  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: olp
      POSTGRES_USER: olp
      POSTGRES_PASSWORD_FILE: /run/olp/database/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=$${POSTGRES_USER} --dbname=$${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    volumes:
      # PostgreSQL 18 stores clusters below a major-version directory. Mounting
      # the parent is required for durable data and link-mode major upgrades.
      - postgres-data:/var/lib/postgresql
      - olp-database-secret:/run/olp/database:ro
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:9.1-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    # Skip the root entrypoint's setpriv transition after capabilities are dropped.
    user: "999:1000"
    # Usage metadata is accepted into a Valkey Stream before PostgreSQL
    # ingestion. everysec persistence can lose roughly one second of recent
    # acknowledgements during power loss; see the recovery contract in operations.md.
    command: ["valkey-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    read_only: true
    volumes:
      - valkey-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cache:
    image: valkey/valkey-bundle:9.1.4@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    profiles: [cache]
    environment:
      VALKEY_EXTRA_FLAGS: '--maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *olp-container
    command: ["migrate"]
    environment:
      <<: *database-environment
      OLP_VALKEY_URL: ${OLP_VALKEY_URL:-redis://valkey:6379}
    volumes:
      - olp-secrets:/run/olp/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: "no"

  olp:
    <<: *olp-container
    command: ["all"]
    environment: *application-environment
    ports:
      - "${OLP_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/olp", "health-probe"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - olp-secrets:/run/olp/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 5m

volumes:
  olp-secrets:
  olp-database-secret:
  postgres-data:
  valkey-data:
