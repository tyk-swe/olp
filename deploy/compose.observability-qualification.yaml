name: olp-observability-qualification
services:
  langfuse:
    image: langfuse/langfuse:3.225.8
    ports:
      - '127.0.0.1:3002:3000'
    depends_on: &langfuseDependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: &langfuseEnvironment
        DATABASE_URL: 'postgresql://langfuse:${QA_LF_POSTGRES_PASSWORD:?}@postgres:5432/langfuse'
        NEXTAUTH_URL: http://127.0.0.1:3002
        SALT: '${QA_LF_SALT:?}'
        ENCRYPTION_KEY: '${QA_LF_ENCRYPTION_KEY:?}'
        TELEMETRY_ENABLED: 'false'
        CLICKHOUSE_URL: http://clickhouse:8123
        CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
        CLICKHOUSE_USER: langfuse
        CLICKHOUSE_PASSWORD: '${QA_LF_CLICKHOUSE_PASSWORD:?}'
        CLICKHOUSE_CLUSTER_ENABLED: 'false'
        REDIS_HOST: redis
        REDIS_PORT: '6379'
        REDIS_AUTH: '${QA_LF_REDIS_PASSWORD:?}'
        LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
        LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: '${QA_LF_S3_ACCESS_KEY:?}'
        LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: '${QA_LF_S3_SECRET_KEY:?}'
        LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
        LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
        LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
        LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
        LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
        LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: '${QA_LF_S3_ACCESS_KEY:?}'
        LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: '${QA_LF_S3_SECRET_KEY:?}'
        LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
        LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
        LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_SECRET: '${QA_LF_AUTH_SECRET:?}'
      LANGFUSE_INIT_ORG_ID: olp-observability-qualification
      LANGFUSE_INIT_ORG_NAME: OLP Observability Qualification
      LANGFUSE_INIT_PROJECT_ID: olp-m5
      LANGFUSE_INIT_PROJECT_NAME: OLP M5 Qualification
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: '${QA_LF_PUBLIC_KEY:?}'
      LANGFUSE_INIT_PROJECT_SECRET_KEY: '${QA_LF_SECRET_KEY:?}'
      LANGFUSE_INIT_USER_EMAIL: observability-fixture@example.test
      LANGFUSE_INIT_USER_NAME: Observability Fixture
      LANGFUSE_INIT_USER_PASSWORD: '${QA_LF_USER_PASSWORD:?}'
    security_opt:
      - no-new-privileges:true
  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.8
    depends_on: *langfuseDependencies
    environment: *langfuseEnvironment
    security_opt:
      - no-new-privileges:true
  phoenix:
    image: arizephoenix/phoenix:version-15.10.0
    ports:
      - '127.0.0.1:6009:6006'
    environment:
      PHOENIX_WORKING_DIR: /tmp/phoenix-qualification
      PHOENIX_ENABLE_AUTH: 'false'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 60
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: '${QA_LF_POSTGRES_PASSWORD:?}'
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U langfuse -d langfuse']
      interval: 3s
      timeout: 3s
      retries: 60
    security_opt:
      - no-new-privileges:true
  redis:
    image: redis:7.4.11
    command: ['redis-server', '--requirepass', '${QA_LF_REDIS_PASSWORD:?}', '--maxmemory-policy', 'noeviction']
    environment:
      REDISCLI_AUTH: '${QA_LF_REDIS_PASSWORD:?}'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 60
    security_opt:
      - no-new-privileges:true
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: '${QA_LF_CLICKHOUSE_PASSWORD:?}'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8123/ping']
      interval: 3s
      timeout: 3s
      retries: 60
    security_opt:
      - no-new-privileges:true
  minio:
    image: olp-qualification-minio:RELEASE.2025-04-22T22-12-26Z
    build:
      context: .
      dockerfile: Dockerfile.minio-qualification
    pull_policy: build
    entrypoint: /bin/sh
    command: ['-c', 'mkdir -p /data/langfuse && exec minio server --address ":9000" /data']
    environment:
      MINIO_ROOT_USER: '${QA_LF_S3_ACCESS_KEY:?}'
      MINIO_ROOT_PASSWORD: '${QA_LF_S3_SECRET_KEY:?}'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 3s
      retries: 60
    security_opt:
      - no-new-privileges:true
volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
