nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/tyk-swe/olp
  tag: ""
  # When set, digest takes precedence over tag and pins the signed immutable
  # release artifact (for example sha256:abc...).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

terminationGracePeriodSeconds: 300
preStopDelaySeconds: 10
revisionHistoryLimit: 3

mediaSpool:
  path: /var/lib/olp/media
  capacityBytes: 1073741824
  volumeSizeLimit: 2Gi

gateway:
  enabled: true
  replicas: 2
  # Sized for high streaming concurrency with headroom for unary traffic.
  # Lower this for smaller deployments.
  httpMaxConnections: 16384
  # Process-local request work is bounded separately from TCP connections.
  # The management value is reserved and is not borrowable by inference.
  httpMaxInFlightInferenceRequests: 256
  httpMaxInFlightManagementRequests: 32
  service:
    enabled: true
    type: ClusterIP
    port: 80
    annotations: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "4", memory: 2Gi }

control:
  enabled: true
  replicas: 1
  httpMaxConnections: 1024
  # The inference pool is unused in control-only mode but remains explicit so
  # switching this component to combined mode cannot erase the reserve.
  httpMaxInFlightInferenceRequests: 256
  httpMaxInFlightManagementRequests: 32
  service:
    enabled: true
    type: ClusterIP
    port: 80
    annotations: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpread:
    enabled: false
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

# Optional same-origin edge routing. The root and management API terminate at
# control, while inference prefixes terminate at gateway. Keep this off
# when an external Gateway API/Ingress controller owns the equivalent routes.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: olp.example.com
  tls:
    enabled: true
    secretName: olp-tls

worker:
  enabled: true
  # One replica keeps the default footprint small. Production installations
  # should run at least three so stream reclaim and outbox takeover remain
  # available through a worker failure.
  replicas: 1
  podDisruptionBudget:
    enabled: true
    # Single-worker defaults must allow voluntary eviction; production
    # multi-replica installations should raise this to at least 1.
    minAvailable: 0
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 300
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

tracing:
  # Unset keeps tracing disabled and installs no exporter or request-path layer.
  # When set, use the complete OTLP/HTTP traces endpoint, including /v1/traces.
  endpoint: ""
  # Optional Secret containing a JSON object of OTLP exporter headers.
  headersSecretName: ""
  headersSecretKey: headers
  sampleRatio: 1.0

config:
  databaseSecretName: olp-postgresql
  databaseSecretKey: url
  valkeySecretName: olp-valkey
  valkeySecretKey: url
  masterKeySecretName: olp-master-key
  masterKeySecretKey: key
  authHmacKeySecretName: olp-auth-hmac-key
  authHmacKeySecretKey: key
  # Required only until the first installation owner is created. Leave empty
  # for an already initialized installation; new control pods fail closed
  # without this mounted secret.
  bootstrapTokenSecretName: ""
  bootstrapTokenSecretKey: token
  # Comma-separated CIDRs for the ingress/controller peers allowed to provide
  # X-Forwarded-For. Required when this chart's Ingress is enabled.
  trustedProxyCidrs: ""
  # Comma-separated browser origins allowed to call the inference gateway
  # cross-origin. Empty disables CORS; wildcards are refused.
  gatewayCorsAllowedOrigins: ""
  # Comma-separated CIDRs exempt from the non-public provider egress denylist
  # and hostnames/IP literals whose provider endpoints may use plain HTTP.
  # Empty keeps the public-only HTTPS policy.
  providerEgressAllowCidrs: ""
  providerEgressAllowHttpHosts: ""
  publicOrigin: https://olp.example.com
  # Hide password sign-in when every operator authenticates through OIDC.
  localLoginEnabled: true
  databaseMaxConnections: 20
  # HTTP/2 connections receive GOAWAY at this age so clients rebalance.
  httpConnectionMaxAgeSeconds: 300
  # Draining connections get this long, extended while responses still
  # stream. Must stay below terminationGracePeriodSeconds - preStopDelaySeconds.
  httpConnectionDrainTimeoutSeconds: 30
  # Request body caps. httpMaxMediaBodyBytes must stay within half of
  # mediaSpool.capacityBytes or every multipart request is refused.
  httpMaxJsonBodyBytes: 2097152
  httpMaxMediaBodyBytes: 67108864
  httpMaxInlineMediaItems: 4
  httpMaxInlineMediaItemBytes: 1048576
  httpMaxInlineMediaTotalBytes: 2097152
  # Provider response caps; the event cap must not exceed the response cap.
  providerMaxResponseBytes: 16777216
  providerMaxEventBytes: 1048576

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

monitoring:
  enabled: false
  namespace: ""
  labels: {}
  interval: 15s
  scrapeTimeout: 5s
  rules:
    enabled: true
    # Zero implements the default runbook policy for both thresholds below:
    # any sustained backlog warns. Raise either value only with a documented
    # installation-specific noise budget.
    requestMetadataPendingThreshold: 0
    runtimeOutboxPendingThreshold: 0

networkPolicy:
  enabled: false
  # Peers allowed to reach the public listener. Rules target container port
  # 8080, not the Service port. namespaceLabels selects one namespace set,
  # for example kubernetes.io/metadata.name: ingress-nginx; some CNIs also
  # need the edge load balancer, node, or kubelet probe CIDRs listed here.
  # At least one peer is required whenever this block is enabled.
  edge:
    namespaceLabels: {}
    cidrs: []
  # Peers allowed to scrape the private observability port 9090. Often, but
  # not necessarily, the same namespace and labels as monitoring.*, which
  # only places the ServiceMonitor object. Leaving both empty denies every
  # scrape.
  prometheus:
    namespaceLabels: {}
    podLabels: {}
  # Egress starts allow-all because provider endpoints are arbitrary public
  # HTTPS hosts. restricted: true replaces that with DNS plus the explicit
  # peers below, and then requires the PostgreSQL and Valkey CIDRs the chart
  # never sees: config.databaseSecretName and config.valkeySecretName carry
  # opaque connection URLs.
  egress:
    restricted: false
    dns:
      enabled: true
    postgresql:
      cidrs: []
      port: 5432
    valkey:
      cidrs: []
      port: 6379
    providers:
      cidrs: ["0.0.0.0/0"]
      port: 443
