{{- if not .Values.config.bootstrapTokenSecretName }}
{{- $name := include "olp.bootstrapTokenSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "olp.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.config.bootstrapTokenSecretKey }}: {{ dig "data" .Values.config.bootstrapTokenSecretKey (randAlphaNum 64 | b64enc) $existing }}
{{- end }}
