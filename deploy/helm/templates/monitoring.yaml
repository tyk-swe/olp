{{- if .Values.monitoring.enabled }}
{{- $root := . -}}
{{- $gatewayService := include "olp.observabilityServiceFullname" (dict "root" . "component" "gateway") -}}
{{- $controlService := include "olp.observabilityServiceFullname" (dict "root" . "component" "control") -}}
{{- $gatewayMonitored := and .Values.gateway.enabled .Values.gateway.service.enabled -}}
{{- $controlMonitored := and .Values.control.enabled .Values.control.service.enabled -}}
{{- $observabilityServiceNames := list -}}
{{- if $gatewayMonitored -}}
{{- $observabilityServiceNames = append $observabilityServiceNames $gatewayService -}}
{{- end -}}
{{- if $controlMonitored -}}
{{- $observabilityServiceNames = append $observabilityServiceNames $controlService -}}
{{- end -}}
{{- $observabilityServices := join "|" $observabilityServiceNames -}}
{{- $readinessExpressions := list -}}
{{- range $service := $observabilityServiceNames -}}
{{- $readinessExpressions = append $readinessExpressions (printf "(min_over_time(olp_ready{namespace=%q,service=%q}[5m]) < 1)" $root.Release.Namespace $service) -}}
{{- $readinessExpressions = append $readinessExpressions (printf "(min_over_time(up{namespace=%q,service=%q}[5m]) < 1)" $root.Release.Namespace $service) -}}
{{- $readinessExpressions = append $readinessExpressions (printf "(absent_over_time(olp_ready{namespace=%q,service=%q}[5m]) == 1)" $root.Release.Namespace $service) -}}
{{- end -}}
{{- $workerAlertsEnabled := and .Values.worker.enabled (gt (int .Values.worker.replicas) 0) (gt (len $observabilityServiceNames) 0) -}}
{{- range $componentName := list "gateway" "control" -}}
{{- $component := index $root.Values $componentName -}}
{{- if and $component.enabled $component.service.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "olp.componentFullname" (dict "root" $root "component" $componentName) }}
  {{- if $root.Values.monitoring.namespace }}
  namespace: {{ $root.Values.monitoring.namespace | quote }}
  {{- end }}
  labels:
    {{- include "olp.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $componentName }}
    {{- with $root.Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "olp.selectorLabels" (dict "root" $root "component" $componentName) | nindent 6 }}
      olp.openllmproxy.dev/observability: "true"
  namespaceSelector:
    matchNames: [{{ $root.Release.Namespace | quote }}]
  targetLabels: [app.kubernetes.io/component]
  endpoints:
    - port: observability
      path: /metrics
      interval: {{ $root.Values.monitoring.interval | quote }}
      scrapeTimeout: {{ $root.Values.monitoring.scrapeTimeout | quote }}
---
{{- end }}
{{- end }}
{{- if and .Values.monitoring.rules.enabled (gt (len $observabilityServiceNames) 0) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "olp.fullname" . }}
  {{- if .Values.monitoring.namespace }}
  namespace: {{ .Values.monitoring.namespace | quote }}
  {{- end }}
  labels:
    {{- include "olp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: openllmproxy.rules
      rules:
        - alert: OLPReadinessAbsent
          expr: {{ join " or " $readinessExpressions }}
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy readiness is absent
            description: A gateway or control target has been unready or unavailable for five minutes.
{{ if $gatewayMonitored }}
        - alert: OLPRequestMetadataEventsDropped
          expr: increase(olp_request_metadata_events_dropped_total{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}[5m]) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy dropped metadata events
            description: Usage and cost completeness is degraded; preserve stream state and reconcile the affected interval.
        - alert: OLPRequestMetadataEventsAbandoned
          expr: increase(olp_request_metadata_events_abandoned_total{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}[5m]) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy abandoned accepted metadata events
            description: A shutdown or writer failure abandoned accepted events and requires reconciliation.
        - alert: OLPRequestMetadataPersistenceUnavailable
          expr: min_over_time(olp_request_metadata_persistence_available{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}[5m]) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy request metadata persistence is unavailable
            description: Metadata delivery has remained unavailable for five minutes.
        - alert: OLPRequestMetadataBacklogHigh
          expr: olp_request_metadata_events_pending{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}} > {{ .Values.monitoring.rules.requestMetadataPendingThreshold }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: OpenLLMProxy request metadata backlog is sustained
            description: The local metadata backlog has remained above the configured threshold.
{{ end }}
        - alert: OLPProviderMetricsIncomplete
          expr: >-
            min(olp_provider_metrics_complete{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}) == 0
            or min(olp_observability_metrics_snapshot_fresh{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: OpenLLMProxy provider metrics are incomplete
            description: Check emitted provider count, snapshot freshness and database latency; collections are capped at 10000 providers.
        - alert: OLPRequestMetadataConsumerBacklogHigh
          expr: max(olp_request_metadata_consumer_pending_events{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}} + olp_request_metadata_consumer_lag_events{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}) > {{ .Values.monitoring.rules.requestMetadataPendingThreshold }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: OpenLLMProxy request metadata consumer backlog is sustained
            description: Delivered or undelivered Stream events have remained above the configured threshold.
{{ if $workerAlertsEnabled }}
        - alert: OLPAsyncPlaneStale
          expr: max(max_over_time(olp_async_plane_current{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}[5m])) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy asynchronous worker plane is stale
            description: No replica has advanced every worker responsibility within its documented heartbeat window.
        - alert: OLPAsyncWorkerObservabilityUnavailable
          expr: min(min_over_time(olp_async_worker_observability_available{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}[5m])) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy asynchronous worker observability is unavailable
            description: A gateway or control target cannot read the durable worker summaries that feed asynchronous-plane alerts.
        - alert: OLPRuntimeOutboxBacklogHigh
          expr: max(olp_runtime_outbox_pending_rows{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}) > {{ .Values.monitoring.rules.runtimeOutboxPendingThreshold }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: OpenLLMProxy runtime outbox backlog is sustained
            description: Unpublished runtime-generation hints have remained above the configured threshold.
        - alert: OLPRuntimeOutboxTakeoverBlocked
          expr: max(increase(olp_runtime_outbox_failed_takeovers_total{namespace={{ .Release.Namespace | quote }},service=~{{ $observabilityServices | quote }}}[5m])) > 0
          for: 0m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy runtime outbox takeover is blocked
            description: A surviving worker could not acquire the advisory lock from an owner past its heartbeat window.
{{ end }}
{{ if $gatewayMonitored }}
        - alert: OLPDistributedLimiterUnavailable
          expr: min_over_time(olp_distributed_limiter_available{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}[5m]) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy distributed limiter is unavailable
            description: Hard-limited keys fail closed while Valkey-backed reservations are unavailable.
        - alert: OLPApiKeyAuthorityStale
          expr: max(olp_api_key_authority_age_seconds{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}) >= 45
          for: 15s
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy API-key authority is stale
            description: New admissions stop at 60 seconds; restore PostgreSQL authority refresh independently of provider activation.
        - alert: OLPRuntimeGenerationNotConverged
          expr: max(olp_runtime_desired_generation{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}} - olp_runtime_generation{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}) > 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: OpenLLMProxy has not activated the desired runtime generation
            description: Inspect rejected provider revisions and credentials while preserving independent key-authority refresh.
        - alert: OLPRuntimeGenerationMissing
          expr: max_over_time(olp_runtime_generation{namespace={{ .Release.Namespace | quote }},service={{ $gatewayService | quote }}}[5m]) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: OpenLLMProxy gateway has no runtime generation
            description: The gateway cannot serve inference until a verified generation is loaded.
{{ end }}
{{- end }}
{{- end }}
