# LiteLLM configuration for S3 of the gateway benchmark (docs/performance.md):
# production.yaml plus the settings of LiteLLM's high-throughput profile,
# https://docs.litellm.ai/docs/proxy/high_throughput. The profile's other half is
# environment and sidecars, which deploy/compose.bench.yaml carries. Keep the
# model_list of the two files identical.
model_list:
  # S1, S2 and S5: one deployment.
  - model_name: bench-route
    litellm_params:
      model: openai/bench-chat
      api_base: os.environ/BENCH_MOCK_API_BASE
      api_key: sk-bench-upstream
  # S3: a deployment of the model OLP's scenario names as an OpenAI model, so
  # that its prompts are tokenized, with the prices OLP's scenario sets, which
  # give the key's budget something to accrue (USD 2 and 4 per million tokens).
  - model_name: bench-priced
    litellm_params:
      model: openai/gpt-4o-bench
      api_base: os.environ/BENCH_MOCK_API_BASE
      api_key: sk-bench-upstream
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000004
  # S4: the first deployment always fails and the second succeeds.
  - model_name: bench-failover
    litellm_params:
      model: openai/bench-primary
      api_base: os.environ/BENCH_MOCK_API_BASE
      api_key: sk-bench-upstream
      order: 1
  - model_name: bench-failover
    litellm_params:
      model: openai/bench-secondary
      api_base: os.environ/BENCH_MOCK_API_BASE
      api_key: sk-bench-upstream
      order: 2

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 5
  cooldown_time: 30
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

general_settings:
  proxy_batch_write_at: 60
  use_redis_transaction_buffer: true
  disable_error_logs: true
  trusted_proxy_ranges: []
  # The profile keeps serving through a slow database check during scale-out.
  allow_requests_on_db_unavailable: true

litellm_settings:
  request_timeout: 600
  set_verbose: false
  json_logs: true
  # Metrics are collected in the gateway and served by the metrics sidecar.
  callbacks:
    - prometheus
