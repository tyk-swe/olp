name: olp-dev
services:
  postgres:
    image: postgres:18@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: olp
      POSTGRES_PASSWORD: olp-local
      POSTGRES_DB: olp
    ports:
      - '127.0.0.1:${OLP_POSTGRES_PORT:-54321}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olp -d olp']
      interval: 1s
      timeout: 3s
      retries: 60
  valkey:
    image: valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    command: ['valkey-server', '--appendonly', 'yes', '--requirepass', 'olp-local']
    ports:
      - '127.0.0.1:${OLP_VALKEY_PORT:-63791}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'olp-local', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60
  cache:
    image: valkey/valkey-bundle:9.1.4@sha256:c64007296a2a38398d4be63847e1c9890954e45574c16cbe607883ba71c6b985
    environment:
      VALKEY_EXTRA_FLAGS: '--maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass olp-local'
    ports:
      - '127.0.0.1:${OLP_CACHE_VALKEY_PORT:-63792}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'olp-local', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  valkey-data:
