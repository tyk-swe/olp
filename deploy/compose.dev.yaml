name: olp-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: olp
      POSTGRES_PASSWORD: olp-local
      POSTGRES_DB: olp
    ports:
      - '127.0.0.1:${OLP_POSTGRES_PORT:-54321}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olp -d olp']
      interval: 1s
      timeout: 3s
      retries: 60
  valkey:
    image: valkey/valkey:9
    command: ['valkey-server', '--appendonly', 'yes', '--requirepass', 'olp-local']
    ports:
      - '127.0.0.1:${OLP_VALKEY_PORT:-63791}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'olp-local', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60
  cache:
    image: valkey/valkey-bundle:9.1.0@sha256:16004aceeb7a1246e2d1bb85d353e38120eb440951cb7d0c971b6d63fda5b3d7
    environment:
      VALKEY_EXTRA_FLAGS: '--maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass olp-local'
    ports:
      - '127.0.0.1:${OLP_CACHE_VALKEY_PORT:-63792}:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'olp-local', 'ping']
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  valkey-data:
