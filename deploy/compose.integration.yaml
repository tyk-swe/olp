services:
  postgres:
    volumes:
      - ${OLP_TEST_TLS_DIR:?}/:/tls:ro
    entrypoint:
      - bash
      - -ec
      - |
        cp /tls/server.key /tmp/server.key
        chmod 600 /tmp/server.key
        chown postgres:postgres /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tmp/server.key
  valkey:
    command: ['valkey-server', '--appendonly', 'yes', '--requirepass', 'olp-local', '--tls-port', '6380', '--tls-cert-file', '/tls/server.crt', '--tls-key-file', '/tls/server.key', '--tls-ca-cert-file', '/tls/ca.crt', '--tls-auth-clients', 'no']
    ports:
      - '127.0.0.1::6380'
    volumes:
      - ${OLP_TEST_TLS_DIR:?}/:/tls:ro
