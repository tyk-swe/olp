# Development-only overlay for exploring OLP traces in an ephemeral Jaeger UI.
services:
  olp:
    environment:
      OLP_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OLP_TRACE_SAMPLE_RATIO: ${OLP_TRACE_SAMPLE_RATIO:-1.0}
      OLP_TRACE_PROPAGATE_UPSTREAM: ${OLP_TRACE_PROPAGATE_UPSTREAM:-true}
      OLP_TRACE_ACCEPT_INBOUND: ${OLP_TRACE_ACCEPT_INBOUND:-true}
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
    ports:
      - "127.0.0.1:16686:16686"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    restart: unless-stopped
